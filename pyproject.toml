[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fusenterm"
version = "0.1.0"
description = "ターミナルのホワイトボードに付箋を貼ってタスク・メモを管理するアプリ"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["sticky", "note", "whiteboard", "tui", "terminal"]
classifiers = [
    "Environment :: Console",
    "Natural Language :: Japanese",
    "Programming Language :: Python :: 3",
]
dependencies = [
    # 端末の配色に追従する ansi-dark テーマが入ったのが 8.2.5 (それ以前は起動できない)
    "textual>=8.2.5",
    "rich>=13.0.0",
]

[project.scripts]
fusenterm = "fusenterm.__main__:main"

[project.urls]
Homepage = "https://github.com/yamato3010/fusenterm"
Repository = "https://github.com/yamato3010/fusenterm"
Issues = "https://github.com/yamato3010/fusenterm/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fusenterm"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/pyproject.toml"]
