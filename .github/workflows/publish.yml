name: CI and Release

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install build twine tomli
      - name: Check package versions
        run: |
          python - <<'PY'
          import runpy, tomli
          version = runpy.run_path('src/fusenterm/__init__.py')['__version__']
          with open('pyproject.toml', 'rb') as f:
              assert tomli.load(f)['project']['version'] == version, 'Package versions must match'
          PY
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python -m pip install dist/*.whl
      - name: Check installed package
        working-directory: /tmp
        run: |
          python - <<'PY'
          from importlib.resources import files
          from fusenterm.__main__ import main
          assert files('fusenterm').joinpath('styles/app.tcss').is_file()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    if: needs.release-please.outputs.release_created == 'true'
    needs: [build, release-please]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fusenterm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Check release artifact version
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          python - <<'PY'
          import os, pathlib, zipfile
          from email.parser import BytesParser
          wheel, = pathlib.Path('dist').glob('*.whl')
          with zipfile.ZipFile(wheel) as archive:
              metadata_path, = (n for n in archive.namelist() if n.endswith('.dist-info/METADATA'))
              metadata = BytesParser().parsebytes(archive.read(metadata_path))
          assert os.environ['RELEASE_TAG'] == f"v{metadata['Version']}", 'Release and artifact versions must match'
          PY
      - name: Upload distributions to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
      - uses: pypa/gh-action-pypi-publish@release/v1
